<ion-header class="ion-no-border custom-header">
  <ion-toolbar>
    <ion-title class="header-title">
      Abrir Sesión: {{ cashRegisterName }}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" class="cancel-btn" (click)="dismiss()" aria-label="Cerrar formulario">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="form-content">
  <div class="cash-inventory-shortcut"><app-inventory-alerts></app-inventory-alerts></div>
  <div class="form-container">
    <div class="form-section">

      <div class="input-group">
        <ion-item class="cash-field" lines="none">
          <ion-input label="Monto de apertura *" labelPlacement="stacked" type="tel" inputmode="numeric" [ngModel]="formData.openingBalance | number:'1.0-0':'es-CO'"
            (ionInput)="formatOpeningBalance($event)" placeholder="0" required>
            <span slot="start" class="currency-symbol">$</span>
          </ion-input>
        </ion-item>
      </div>
      <div class="input-group">
        <ion-item class="cash-field" lines="none">
          <ion-textarea label="Notas (opcional)" labelPlacement="stacked" rows="3" [(ngModel)]="formData.notes"
            placeholder="Ej: Se inicia con sencillo para vueltos.">
          </ion-textarea>
        </ion-item>
      </div>

    </div>

    <div class="button-section">
      <ion-button expand="block" class="save-btn" (click)="save()" [disabled]="!isFormValid()">
        <ion-icon name="play-outline" slot="start"></ion-icon>
        Abrir Sesión
      </ion-button>
    </div>
  </div>
</ion-content>
