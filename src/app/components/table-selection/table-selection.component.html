<ion-header class="ion-no-border table-modal-header">
  <ion-toolbar>
    <div class="table-modal-heading">
      <div>
        <h1>Selecciona una mesa</h1>
        <p>Elige una mesa disponible para comenzar la comanda.</p>
      </div>
      <ion-button fill="clear" class="close-button" aria-label="Cerrar" (click)="closeModal()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="table-modal-content">
  <ng-container *ngIf="tables && tables.length > 0; else noTablesTemplate">
    <div class="zone-tabs" role="tablist" aria-label="Zonas del establecimiento">
      <button
        type="button"
        role="tab"
        *ngFor="let group of zoneGroups"
        [class.is-selected]="isZoneSelected(group)"
        [attr.aria-selected]="isZoneSelected(group)"
        (click)="selectZone(group)"
      >
        {{ group.name }}
      </button>
    </div>

    <section class="zone-plan" *ngIf="activeZoneGroup as group" role="tabpanel">
      <div class="table-grid">
        <button
          type="button"
          class="table-card"
          *ngFor="let table of group.tables"
          [class.is-occupied]="table.isBussy"
          [class.is-round]="group.iconType === 'table'"
          [class.is-wide]="group.iconType === 'bar'"
          [disabled]="table.isBussy"
          [attr.aria-label]="table.tableNumber + (table.isBussy ? ', ocupada' : ', disponible')"
          (click)="selectT(table, false)"
        >
          <span class="table-card-icon">
            <ion-icon [name]="getZoneIcon(group.iconType)"></ion-icon>
          </span>
          <strong>{{ table.tableNumber }}</strong>
          <span class="table-capacity">
            {{ table.capacity || 1 }} {{ (table.capacity || 1) === 1 ? 'puesto' : 'puestos' }}
          </span>
        </button>
      </div>

      <div class="plan-entry">
        <ion-icon name="enter-outline"></ion-icon>
        Entrada
      </div>
    </section>

    <div class="availability-summary" aria-label="Estado de las mesas">
      <span class="availability-key is-available"><i></i>Disponible ({{ availableTablesCount }})</span>
      <span class="availability-key is-occupied"><i></i>Ocupada ({{ occupiedTablesCount }})</span>
    </div>
  </ng-container>

  <ng-template #noTablesTemplate>
    <div class="empty-tables">
      <span class="empty-icon"><ion-icon name="restaurant-outline"></ion-icon></span>
      <h2>Aún no hay mesas</h2>
      <p>Configura la primera mesa para comenzar a tomar pedidos.</p>
      <ion-button (click)="redirectToAddTables()">
        <ion-icon name="add-outline" slot="start"></ion-icon>
        Agregar mesas ahora
      </ion-button>
    </div>
  </ng-template>
</ion-content>
