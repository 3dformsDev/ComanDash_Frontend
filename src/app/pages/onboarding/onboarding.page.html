<ion-content>
  <swiper-container [pagination]="true" class="mySwiper">
    
    <swiper-slide>
      <div class="slide-info">
        <img src="assets/images/shop.png" alt="Tienda" />
        <h2>Bienvenido</h2>
        <p>Descubre los mejores restaurantes cerca de ti.</p>
      </div>
    </swiper-slide>

    <swiper-slide>
      <div class="slide-info">
        <img src="assets/images/truck.png" alt="Camión de reparto" />
        <h2>Pedidos rápidos</h2>
        <p>Tu comida favorita en minutos.</p>
      </div>
    </swiper-slide>

    <swiper-slide>
      <div class="slide-info">
        <img src="assets/images/delivery.png" alt="Entrega segura" />
        <h2>Entrega segura</h2>
        <p>Confiable y sin complicaciones.</p>
      </div>
    </swiper-slide>
    
  </swiper-container>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar>
    <ion-button expand="block" routerLink="/login">¡VAMOS!</ion-button>
  </ion-toolbar>
</ion-footer>
