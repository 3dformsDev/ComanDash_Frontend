<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="" defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Administración</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list class="admin-menu-list" lines="none">
    <ng-container *ngFor="let option of adminOptions">
      <ion-item *ifRole="option.roleVerify" [routerLink]="option.url" detail="true">
        <ion-icon [name]="option.icon" slot="start" color="primary"></ion-icon>
        <ion-label>{{ option.title }}</ion-label>
      </ion-item>
    </ng-container>
  </ion-list>
  <ion-button id="go-to-admin-view" expand="block" fill="solid"
    style="--background: var(--accent, #ff3131); --background-hover: var(--dark, #ff3131); --background-focused: var(--dark, #ff3131); --color: var(--light, #ffffff); --border-radius: 12px; --padding-top: 12px; --padding-bottom: 12px; text-transform: none; font-weight: 600; font-size: 14px;"
    class="rounded" (click)="logout()">
    <ion-icon slot="icon-only" name="log-out-outline" class="mr-2"></ion-icon>
    Cerrar sesión
  </ion-button>
</ion-content>
